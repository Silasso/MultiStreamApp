<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>MultiStream — Cast Twitch Streams Instantly</title>
  <meta name="description"
    content="Keep up to 16 Twitch streams in a live grid and click any of them to cast it full-window with sound — instantly, without reloading." />
  <meta name="theme-color" content="#9146ff" />

  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📺</text></svg>" />

  <link rel="preconnect" href="https://player.twitch.tv" />
  <link rel="stylesheet" href="styles/main.css" />
</head>

<body>

  <!-- ═══ NAVBAR ═══════════════════════════════════════ -->
  <nav id="navbar" aria-label="Main navigation">
    <a href="./" class="nav-logo" aria-label="MultiStream home">
      <div class="nav-logo-icon" aria-hidden="true">📺</div>
      <span class="nav-logo-text">Multi<span>Stream</span></span>
    </a>

    <div class="nav-actions">
      <div class="stream-count-badge" id="stream-count">0 / 16 streams</div>
      <button id="btn-add-stream" class="btn-primary">+ Add Stream</button>
    </div>
  </nav>

  <!-- ═══ APP ══════════════════════════════════════════ -->
  <main id="app">
    <section id="grid-view" aria-label="Stream grid">
      <header class="grid-header">
        <h1>Live Streams</h1>
        <p>Click a stream to cast it full-window with sound · <kbd>1</kbd>–<kbd>9</kbd> switch instantly ·
          <kbd>Esc</kbd> back to grid</p>
      </header>

      <!-- Shown only when every player stays paused (autoplay blocked); the text
           names the cause. Sits above the grid, never on top of a player. -->
      <div id="autoplay-hint" hidden>
        <span id="autoplay-hint-text">Your browser paused the streams.</span>
        <button id="btn-start-all" class="btn-primary">▶ Start all streams</button>
      </div>

      <!-- Cards are created by scripts/app.js. In kino mode the active card
           itself is pinned full-window, so its player never reloads. -->
      <div id="stream-grid" role="list"></div>
    </section>
  </main>

  <!-- Kino bar: sits ABOVE the player, never on top of it (Twitch blocks
       autoplay for obscured players). -->
  <div id="kino-bar" role="toolbar" aria-label="Kino controls">
    <div class="kino-title">
      <span class="live-dot" aria-hidden="true"></span>
      <span id="kino-channel"></span>
    </div>
    <div class="kino-actions">
      <label class="kino-volume" title="Volume">
        <span aria-hidden="true">Vol</span>
        <input id="kino-volume" type="range" min="0" max="100" step="1" value="50" aria-label="Volume" />
      </label>
      <button id="kino-fullscreen" class="btn-ghost" title="Browser fullscreen (F)">Fullscreen</button>
      <button id="kino-close" title="Back to grid (Esc)">✕ Close</button>
    </div>
  </div>

  <!-- ═══ ADD STREAM MODAL ═════════════════════════════ -->
  <div id="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <form class="modal" id="modal-form">
      <h2 id="modal-title">Add a Stream</h2>
      <p>Enter a Twitch channel name or paste the full URL.</p>

      <div class="modal-field">
        <label for="modal-channel-input">Twitch Channel</label>
        <input id="modal-channel-input" type="text" placeholder="e.g. shroud or twitch.tv/shroud" autocomplete="off"
          spellcheck="false" aria-describedby="modal-hint" />
        <small id="modal-hint">Channel names: 1–25 chars, a–z, 0–9, _</small>
      </div>

      <div class="modal-actions">
        <button type="button" id="btn-modal-close" class="btn-ghost">Cancel</button>
        <button type="submit" class="btn-primary">Add to Grid</button>
      </div>
    </form>
  </div>

  <div id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

  <script src="https://player.twitch.tv/js/embed/v1.js" defer></script>
  <script src="scripts/app.js" defer></script>
</body>

</html>
