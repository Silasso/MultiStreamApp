<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- SEO -->
  <title>MultiStream — Watch Multiple Twitch Streams at Once</title>
  <meta name="description" content="MultiStream is a free SaaS that lets you watch multiple Twitch streams simultaneously in a gorgeous 4×4 grid. Click any stream to open it in full Kino mode with sound." />
  <meta name="theme-color" content="#9146ff" />

  <!-- Open Graph -->
  <meta property="og:type"        content="website" />
  <meta property="og:title"       content="MultiStream — Watch Multiple Twitch Streams at Once" />
  <meta property="og:description" content="Watch up to 16 Twitch streams at the same time. Click any stream to enter Kino mode." />
  <meta property="og:url"         content="https://multistream.app" />

  <!-- Favicon (emoji) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📺</text></svg>" />

  <!-- Styles -->
  <link rel="stylesheet" href="styles/main.css" />
</head>

<body>

  <!-- ═══════════════════════════════════════════════
       NAVBAR
  ═══════════════════════════════════════════════ -->
  <nav id="navbar" aria-label="Main navigation">
    <a href="/" class="nav-logo" aria-label="MultiStream home">
      <div class="nav-logo-icon" aria-hidden="true">📺</div>
      <span class="nav-logo-text">Multi<span>Stream</span></span>
    </a>

    <div class="nav-actions">
      <div class="nav-pill" aria-label="Twitch live status">
        <span class="dot" aria-hidden="true"></span>
        Twitch Live
      </div>
      <button
        id="btn-add-stream"
        class="btn-primary"
        aria-label="Add a new stream to the grid"
      >
        + Add Stream
      </button>
    </div>
  </nav>

  <!-- ═══════════════════════════════════════════════
       APP WRAPPER
  ═══════════════════════════════════════════════ -->
  <main id="app">

    <!-- ── Grid View ────────────────────────────── -->
    <section id="grid-view" aria-label="Stream grid">
      <header class="grid-header">
        <div class="grid-header-left">
          <h1>Live Streams</h1>
          <p>Click any stream to watch in Kino mode with full sound</p>
        </div>
        <div class="stream-count-badge">
          <span aria-hidden="true">🎮</span>
          <span id="stream-count">0 / 16 streams</span>
        </div>
      </header>

      <!-- 4×4 grid — populated by JS -->
      <div
        id="stream-grid"
        role="list"
        aria-label="4 by 4 stream grid"
      ></div>
    </section>

    <!-- ── Kino Mode (full-window) ───────────────── -->
    <div
      id="kino-view"
      role="dialog"
      aria-modal="true"
      aria-label="Kino stream viewer"
    >
      <!-- Top bar (hover to reveal) -->
      <div id="kino-bar">
        <div class="kino-info">
          <div class="kino-live" aria-label="Live stream indicator">LIVE</div>
          <span
            id="kino-channel-name"
            class="kino-channel-name"
            aria-live="polite"
          ></span>
        </div>

        <button
          id="kino-close"
          aria-label="Close kino mode and return to grid"
          title="Close (Esc)"
        >✕</button>
      </div>

      <!-- Stream iframe — src injected by JS -->
      <iframe
        id="kino-iframe"
        allow="autoplay; fullscreen; picture-in-picture"
        allowfullscreen
        title="Stream viewer"
      ></iframe>
    </div>

  </main>

  <!-- ═══════════════════════════════════════════════
       ADD STREAM MODAL
  ═══════════════════════════════════════════════ -->
  <div
    id="modal-overlay"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modal-title"
  >
    <div class="modal">
      <h2 id="modal-title">Add a Stream</h2>
      <p>Enter a Twitch channel name or paste the full URL.</p>

      <div class="modal-field">
        <label for="modal-channel-input">Twitch Channel</label>
        <input
          id="modal-channel-input"
          type="text"
          placeholder="e.g. shroud or twitch.tv/shroud"
          autocomplete="off"
          spellcheck="false"
          aria-describedby="modal-hint"
        />
      </div>

      <p id="modal-hint" style="font-size:11px; margin-top:6px; color: var(--text-muted);">
        Accepts channel names (1–25 chars: a–z, 0–9, _)
      </p>

      <div class="modal-actions">
        <button id="btn-modal-close" class="btn-ghost">Cancel</button>
        <button id="btn-modal-add"   class="btn-modal-add">Add to Grid</button>
      </div>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════════
       TOAST NOTIFICATION
  ═══════════════════════════════════════════════ -->
  <div id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

  <!-- Scripts -->
  <script src="scripts/app.js" defer></script>
</body>
</html>
